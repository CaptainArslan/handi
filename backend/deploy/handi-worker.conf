; /etc/supervisor/conf.d/handi-worker.conf
; Queue worker: makes photo thumbnails in the background when MEDIA_QUEUE_CONVERSIONS=true.
;   sudo apt install -y supervisor
;   sudo cp backend/deploy/handi-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
[program:handi-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/handi/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/handi/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/handi/backend/storage/logs/worker.log
