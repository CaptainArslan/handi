# /etc/nginx/sites-available/handi
# Handi API + admin on https://handi.hegemonicinc.com
#
#   sudo cp backend/deploy/nginx.conf /etc/nginx/sites-available/handi
#   sudo ln -s /etc/nginx/sites-available/handi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d handi.hegemonicinc.com     # adds HTTPS + the 80 → 443 redirect
#
# Match fastcgi_pass to the PHP-FPM you installed: ls /run/php/  (php8.2-fpm.sock, php8.2-fpm.sock, …)
server {
    listen 80;
    listen [::]:80;

    server_name handi.hegemonicinc.com;
    root /var/www/handi/backend/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # Dish photos are up to 10 MB (app + admin). Keep PHP's upload_max_filesize / post_max_size above this too.
    client_max_body_size 12M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Uploaded photos, brand video and Filament assets: let browsers cache them.
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|mp4|webm|css|js|woff2?)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
