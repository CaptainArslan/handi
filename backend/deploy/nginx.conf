# /etc/nginx/sites-available/handi
# Handi website (/), web app (/app), API (/api) and admin (/admin) on https://handi.hegemonicinc.com
#
#   sudo cp backend/deploy/nginx.conf /etc/nginx/sites-available/handi
#   sudo ln -s /etc/nginx/sites-available/handi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d handi.hegemonicinc.com     # adds HTTPS + the 80 → 443 redirect
#
# Match fastcgi_pass to the PHP-FPM you installed: ls /run/php/  (php8.2-fpm.sock, php8.2-fpm.sock, …)
server {
    listen 80;
    listen [::]:80;

    server_name handi.hegemonicinc.com;
    root /var/www/handi/backend/public;

    # Security headers (X-Frame-Options, nosniff, CSP, HSTS…) are set by Laravel, so they aren't duplicated here.

    index index.php;
    charset utf-8;

    # Dish photos are up to 10 MB (app + admin). Keep PHP's upload_max_filesize / post_max_size above this too.
    client_max_body_size 12M;

    # Compress text responses (website HTML, CSS, JSON API, SVG, XML).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Web version of the app (frontend `npm run build:web` → public/app).
    # Its bundles and images have content hashes in their names, so they are cached for a year.
    location ^~ /app/_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ^~ /app/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    # Every other /app/... address is a screen of the app: Laravel returns the app page with its headers.
    location = /app {
        rewrite ^ /index.php last;
    }
    location ^~ /app/ {
        location ~ /\. {
            deny all;
        }
        try_files $uri /index.php?$query_string;
    }

    # Website fonts and images change only with a new file name, so browsers may keep them for a year.
    location ~* ^/(fonts/site|images/site)/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded photos, brand video and Filament assets: let browsers cache them.
    location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|mp4|webm|css|js|woff2?)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
